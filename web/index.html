<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verdict</title>
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="logo" href="/" aria-label="Verdict home">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path d="M17 27 28.5 46 46 19" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="46" cy="19" r="4.5" fill="var(--chart-a)"/>
        </svg>
      </a>
      <nav class="pills" aria-label="Views">
        <button class="pill active" data-view="dashboard">Dashboard</button>
        <button class="pill" data-view="history">History</button>
        <button class="pill" data-view="about">How it works</button>
      </nav>
      <div class="model-chip" title="Language model in use">
        <span class="live-dot"></span><span id="model-name">Loading…</span>
      </div>
    </header>

    <aside class="rail" aria-label="Navigation">
      <div class="rail-group">
        <button class="rail-btn active" data-view="dashboard" aria-label="Dashboard" data-icon="home"></button>
        <button class="rail-btn" data-view="history" aria-label="History" data-icon="clock"></button>
        <button class="rail-btn" data-view="about" aria-label="How it works" data-icon="info"></button>
      </div>
      <div class="rail-group">
        <button class="rail-btn" data-theme-set="light" aria-label="Light theme" data-icon="sun"></button>
        <button class="rail-btn" data-theme-set="dark" aria-label="Dark theme" data-icon="moon"></button>
      </div>
    </aside>

    <main>
      <!-- ============ Dashboard ============ -->
      <section class="view" id="view-dashboard">
        <h1>Verdict</h1>
        <div class="grid">
          <article class="card ask">
            <div class="card-head">
              <div><h2>Ask a question</h2><p class="sub">The crew researches, attacks and verifies</p></div>
            </div>
            <form class="search" id="ask-form">
              <input id="question" placeholder="Is the Great Wall visible from space?" autocomplete="off" required>
              <button class="round-btn" type="submit" aria-label="Run the crew" data-icon="arrow"></button>
            </form>
            <div class="examples" id="examples" aria-label="Example questions"></div>
            <div class="agents" id="agents"></div>
          </article>

          <article class="card answer" id="answer-card">
            <div class="card-head">
              <div><h2>Verified answer</h2><p class="sub">Written only from claims that survived the Skeptic</p></div>
              <a class="ghost-btn" id="download" href="#" download hidden aria-label="Download report" data-icon="download"></a>
            </div>
            <div class="answer-body">
              <div>
                <p class="question-line" id="question-line"></p>
                <div class="answer-text" id="answer"></div>
              </div>
              <div class="chart-wrap">
                <div class="legend">
                  <span><i class="swatch kept"></i>Kept</span>
                  <span><i class="swatch dropped"></i>Dropped</span>
                  <span><i class="swatch line"></i>Keep threshold</span>
                </div>
                <div id="chart"></div>
              </div>
            </div>
            <div class="stats" id="stats"></div>
          </article>

          <article class="card claims" id="claims-card">
            <div class="card-head">
              <div><h2>Claims</h2><p class="sub">Click a claim to see the evidence</p></div>
              <select class="select" id="claim-filter" aria-label="Filter claims">
                <option value="all">All</option>
                <option value="kept">Kept</option>
                <option value="dropped">Dropped</option>
              </select>
            </div>
            <ul class="rows" id="claims"></ul>
          </article>

          <article class="card sources" id="sources-card">
            <div class="card-head">
              <div><h2>Sources</h2><p class="sub" id="sources-sub">Websites the crew relied on</p></div>
            </div>
            <ul class="rows" id="sources"></ul>
            <button class="text-btn" id="sources-toggle" hidden></button>
          </article>
        </div>
      </section>

      <!-- ============ History ============ -->
      <section class="view" id="view-history" hidden>
        <h1>History</h1>
        <div class="history" id="history"></div>
      </section>

      <!-- ============ How it works ============ -->
      <section class="view" id="view-about" hidden>
        <h1>How it works</h1>
        <div class="about" id="about"></div>
      </section>
    </main>
  </div>

  <dialog class="dialog" id="claim-dialog"></dialog>
  <div class="tooltip" id="tooltip" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <script src="/static/app.js"></script>
</body>
</html>
